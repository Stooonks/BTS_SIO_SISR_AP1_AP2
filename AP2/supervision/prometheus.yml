# Prometheus – supervision RedOne (VM 204, 10.2.1.3)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'redone'

# Règles d'alerte (visibles dans Prometheus > Alerts et dans Grafana)
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          host: 'srv-supervision'

  # Serveur de supervision (node_exporter local, inclut les métriques ClamAV)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          host: 'srv-supervision'

  # Autres serveurs Linux RedOne : ajouter les cibles dans
  # /etc/prometheus/targets/linux.yml (rechargé automatiquement, sans redémarrage)
  - job_name: 'linux'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/linux.yml']

  # Serveurs Windows (AD) avec windows_exporter (port 9182)
  - job_name: 'windows'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/windows.yml']
