# Loki - SRV-SUPERVISION (RedOne) : journaux ClamAV et alertes Wazuh
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki            # stockage persistant (l'ancien /tmp est vidé à chaque redémarrage)
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  retention_period: 720h                # conservation : 30 jours
  reject_old_samples: true
  discover_log_levels: false             # le niveau Wazuh (0-15) ne doit pas être interprété comme un niveau de log
  reject_old_samples_max_age: 168h
  metric_aggregation_enabled: true
  enable_multi_variant_queries: true

compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

pattern_ingester:
  enabled: true
  metric_aggregation:
    loki_address: localhost:3100

frontend:
  encoding: protobuf

analytics:
  reporting_enabled: false
